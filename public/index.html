<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cheesecake Election Map</title><link rel="icon" href="data:,"><style>

</style></head><body><nav class="toolbar" role="tablist" aria-label="Election office"><button type="button" role="tab" id="senate" aria-selected="true">Senate</button><button type="button" role="tab" id="house" aria-selected="false">House</button></nav><div class="toolbar overlays" role="group" aria-label="Restaurant overlays"><button type="button" data-overlay="cheesecake" aria-pressed="true"><span class="toggle-mark cheesecake-mark" aria-hidden="true"></span>Cheesecake Factory</button><button type="button" data-overlay="cracker" aria-pressed="true"><span class="toggle-mark cracker-mark" aria-hidden="true"></span>Cracker Barrel</button></div><span id="help">Scroll to zoom · drag to pan</span><svg id="map" role="img" aria-label="Live national election map with selectable Cheesecake Factory and Cracker Barrel locations"></svg><footer id="status"><span class="key"><i class="swatch" style="background:#427fc0"></i>Democratic lead</span><span class="key"><i class="swatch" style="background:#c65b64"></i>Republican lead</span><span class="key"><i class="swatch" style="background:#7eab7b"></i>Other lead</span><span class="key"><i class="swatch" style="background:#29323d"></i>Awaiting returns</span><span class="key" id="no-race-key"><i class="swatch" style="background:#858a92"></i>No Senate race</span><span class="key" data-brand-key="cheesecake"><i class="swatch dot"></i>Cheesecake Factory</span><span class="key" data-brand-key="cracker"><i class="swatch" style="background:#60d8e9;transform:rotate(45deg)"></i>Cracker Barrel</span><span id="time">Loading live results…</span><a class="source" href="https://civicapi.org/decision-2026" target="_blank" rel="noreferrer">civicAPI</a></footer><div id="tooltip" role="tooltip" hidden></div><script src="/d3.min.js"></script><script src="/topojson.min.js"></script><script src="/map.js"></script></body></html>
